version: 2

sources:
  - name: raw_data
    description: "Raw data from the taxi rides in New York 2019/2020"
    database: kestra-sandbox-493016
    schema: nytaxi
    tables:
      - name: green_tripdata_partitioned
        description: "Raw green taxi trip data"
        columns:
          - name: vendorid
            description: |
              A code indicating the provider associated with the trip record.
              1. 'Creative Mobile Technologies, LLC'
              2. 'VeriFone Inc.'
              4. 'Unknown/Other'
            data_type: integer
            meta: 
              pii: false
              ownership: data_team
              importance: high
              formatting: none
      - name: yellow_tripdata_partitioned
        description: "Raw yellow taxi trip data"